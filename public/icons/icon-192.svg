    <!-- Stitching / divider line -->
    <line x1="9" y1="20" x2="39" y2="20" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Wallet Latch Flap -->
    <path d="M28 20C28 18.9 28.9 18 30 18H39.5V31H30C28.9 31 28 30.1 28 29V20Z" fill="#4f46e5" filter="url(#subtleShadow192)"/>

    <!-- Emerald Clasp -->
