<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="walletGrad192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="subtleShadow192" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#bgGrad192)"/>

  <g transform="scale(4) translate(0, 0)">
    <!-- Top bill / card peeking out -->
    <path d="M14 13.5C14 12.12 15.12 11 16.5 11H31.5C32.88 11 34 12.12 34 13.5V17H14V13.5Z" fill="#c7d2fe"/>

    <!-- Main Wallet Body -->
