<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="walletGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="subtleShadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bgGrad512)"/>

  <g transform="scale(10.6666) translate(0, 0)">
    <!-- Top bill / card peeking out -->
    <path d="M14 13.5C14 12.12 15.12 11 16.5 11H31.5C32.88 11 34 12.12 34 13.5V17H14V13.5Z" fill="#c7d2fe"/>

    <!-- Main Wallet Body -->
    <rect x="9" y="16" width="30" height="20" rx="4" fill="url(#walletGrad512)" filter="url(#subtleShadow512)"/>

    <!-- Stitching / divider line -->
    <line x1="9" y1="20" x2="39" y2="20" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Wallet Latch Flap -->
    <path d="M28 20C28 18.9 28.9 18 30 18H39.5V31H30C28.9 31 28 30.1 28 29V20Z" fill="#4f46e5" filter="url(#subtleShadow512)"/>

    <!-- Emerald Clasp -->
    <circle cx="33.5" cy="24.5" r="2.2" fill="#10b981"/>
    <circle cx="33.5" cy="24.5" r="1" fill="#ecfdf5"/>
  </g>
</svg>
